name: Sentra
options:
  minimumXcodeGenVersion: "2.42.0"
  developmentLanguage: el
  deploymentTarget:
    iOS: "17.0"
  usesTabs: false
  indentWidth: 4
  tabWidth: 4
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: "2.20.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Sentra:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sentra
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sarantos.sentra
        INFOPLIST_FILE: Sentra/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Supabase
        product: Supabase
  SentraTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SentraTests
        excludes:
          - Fixtures
      - path: SentraTests/Fixtures
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sarantos.sentra.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Sentra
schemes:
  Sentra:
    build:
      targets:
        Sentra: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SentraTests